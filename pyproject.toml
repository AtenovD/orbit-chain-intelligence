[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator-backend"
version = "0.1.0"
description = "Provider-agnostic backend for real-time multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.116,<1",
  "greenlet>=3,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.0,<4",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.9,<7",
  "python-docx>=1.2,<2",
  "sentry-sdk[fastapi]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:pytest_ethereum"
