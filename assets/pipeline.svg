<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Orbit decision pipeline">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a8f044"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="18" fill="#07120b"/>
  <text x="40" y="50" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#a8f044">HOW A VERDICT IS MADE</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <g>
      <rect x="40" y="90" width="210" height="150" rx="14" fill="#0e2415" stroke="#3f7d2c"/>
      <text x="145" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#f1fbe8">Chain data</text>
      <text x="145" y="160" text-anchor="middle" font-size="14" fill="#8fa596">Native RPC tools</text>
      <text x="145" y="182" text-anchor="middle" font-size="14" fill="#8fa596">Blockscout · Bitquery</text>
      <text x="145" y="204" text-anchor="middle" font-size="14" fill="#8fa596">Web · YouTube · TikTok</text>
    </g>
    <g>
      <rect x="290" y="90" width="230" height="150" rx="14" fill="#0e2415" stroke="#3f7d2c"/>
      <text x="405" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#f1fbe8">Five-agent crew</text>
      <circle cx="335" cy="172" r="12" fill="#a8f044"/><circle cx="370" cy="172" r="12" fill="#60a5fa"/>
      <circle cx="405" cy="172" r="12" fill="#f59e0b"/><circle cx="440" cy="172" r="12" fill="#34d399"/>
      <circle cx="475" cy="172" r="12" fill="#f472b6"/>
      <text x="405" y="212" text-anchor="middle" font-size="14" fill="#8fa596">Sequential roundtable</text>
    </g>
    <g>
      <rect x="560" y="90" width="210" height="150" rx="14" fill="#0e2415" stroke="#3f7d2c"/>
      <text x="665" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#f1fbe8">Decision contract</text>
      <text x="665" y="160" text-anchor="middle" font-size="14" fill="#8fa596">Stance · confidence</text>
      <text x="665" y="182" text-anchor="middle" font-size="14" fill="#8fa596">Evidence · unknowns</text>
      <text x="665" y="204" text-anchor="middle" font-size="14" fill="#8fa596">Invalidation conditions</text>
    </g>
    <g>
      <rect x="810" y="90" width="210" height="150" rx="14" fill="#1a2a0c" stroke="#a8f044" stroke-width="2"/>
      <text x="915" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#e7ff9f">Protection gate</text>
      <text x="915" y="160" text-anchor="middle" font-size="14" fill="#b9c9ad">Deterministic code,</text>
      <text x="915" y="182" text-anchor="middle" font-size="14" fill="#b9c9ad">not a model. Can only</text>
      <text x="915" y="204" text-anchor="middle" font-size="14" fill="#b9c9ad">downgrade ENTER.</text>
    </g>
    <g>
      <rect x="1060" y="90" width="180" height="150" rx="14" fill="#0e2415" stroke="#3f7d2c"/>
      <text x="1150" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#f1fbe8">Verdict</text>
      <text x="1150" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">ENTER</text>
      <text x="1150" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#f59e0b">WATCH</text>
      <text x="1150" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#f87171">SKIP</text>
    </g>
  </g>
  <g stroke="#a8f044" stroke-width="2" marker-end="url(#arr)">
    <path d="M252 165H286"/><path d="M522 165H556"/><path d="M772 165H806"/><path d="M1022 165H1056"/>
  </g>
  <g stroke="#3f7d2c" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)">
    <path d="M1150 242V300H1040"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="290" y="280" width="750" height="100" rx="14" fill="#0e2415" stroke="#3f7d2c"/>
    <text x="320" y="316" font-size="20" font-weight="700" fill="#f1fbe8">Audit trail and Paper Lab</text>
    <text x="320" y="345" font-size="14" fill="#8fa596">Immutable Decision Record · replay with no look-ahead · Brier calibration and hit-rate scorecards</text>
    <text x="320" y="367" font-size="14" fill="#8fa596">Long-only paper positions with explicit fees and slippage. real_funds is always false.</text>
  </g>
</svg>
