<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Orbit: chain intelligence for Robinhood Chain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d08"/><stop offset="1" stop-color="#0b1f12"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#7dff3a" stop-opacity=".28"/><stop offset="1" stop-color="#7dff3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ffe3"/><stop offset="1" stop-color="#b6ff5c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3a26" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#glow)"/>
  <g fill="none" stroke="#a8f044" stroke-opacity=".35">
    <ellipse cx="1000" cy="190" rx="250" ry="92" transform="rotate(-18 1000 190)"/>
    <ellipse cx="1000" cy="190" rx="170" ry="62" transform="rotate(24 1000 190)"/>
    <ellipse cx="1000" cy="190" rx="110" ry="110"/>
  </g>
  <circle cx="1000" cy="190" r="46" fill="#a8f044"/>
  <circle cx="1000" cy="190" r="46" fill="none" stroke="#e7ff9f" stroke-width="3"/>
  <circle cx="1000" cy="190" r="16" fill="#0b1f12"/>
  <circle cx="1128" cy="119" r="9" fill="#60a5fa"/>
  <circle cx="878" cy="150" r="9" fill="#f59e0b"/>
  <circle cx="1060" cy="286" r="9" fill="#34d399"/>
  <circle cx="930" cy="262" r="9" fill="#f472b6"/>
  <circle cx="1104" cy="240" r="9" fill="#a78bfa"/>
  <text x="72" y="86" font-family="Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#a8f044">ROBINHOOD CHAIN · 4663</text>
  <text x="68" y="188" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4" fill="url(#word)">Orbit</text>
  <text x="72" y="238" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#e9f5e1">Check the token before you trade it.</text>
  <text x="72" y="282" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8fa596">Five agents check holders, liquidity and owner permissions.</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="2">
    <rect x="72" y="310" width="150" height="34" rx="17" fill="#12301c" stroke="#3f7d2c"/>
    <text x="147" y="332" text-anchor="middle" fill="#b6ff5c">OPEN SOURCE</text>
    <rect x="234" y="310" width="150" height="34" rx="17" fill="#12301c" stroke="#3f7d2c"/>
    <text x="309" y="332" text-anchor="middle" fill="#b6ff5c">PAPER ONLY</text>
    <rect x="396" y="310" width="170" height="34" rx="17" fill="#12301c" stroke="#3f7d2c"/>
    <text x="481" y="332" text-anchor="middle" fill="#b6ff5c">NO LIVE ORDERS</text>
  </g>
</svg>
